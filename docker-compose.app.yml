# APP VM stack for the beta deployment (docs/deployment/TECH.md, Tasks 1/3/8).
#
# Runs on the Oracle Cloud "App VM" only: the FastAPI API, the Kafka consumer
# workers, and Caddy. This is the internet-facing VM — its public IP is what
# the domain's DNS A record points at (TECH.md Task 5). Postgres and Kafka live
# on the separate "Data VM" and are started first from docker-compose.data.yml.
#
# This is a STANDALONE file, NOT an overlay. There is nothing on this VM for it
# to overlay: docker-compose.yml defines postgres and kafka, which do not run
# here at all. Never pass `-f docker-compose.yml` alongside this file.
#
# ---------------------------------------------------------------------------
# USAGE (the single supported command — run it from the repo root on the APP VM,
# AFTER the Data VM's stack is up and reachable):
#
#   docker compose --env-file .env.production -f docker-compose.app.yml up -d
#
# Why both `--env-file` and the per-service `env_file:` below? They do two
# different jobs and this stack needs both:
#
#   * `--env-file .env.production` feeds ${VAR} INTERPOLATION in this YAML
#     (CADDY_EMAIL / API_DOMAIN passed through to Caddy). Compose only
#     auto-reads a file literally named `.env` for interpolation.
#   * `env_file: [.env.production]` on a service injects the whole file as
#     ENVIRONMENT VARIABLES INSIDE that container (DATABASE_URL,
#     KAFKA_BOOTSTRAP_SERVERS, GROQ_API_KEY, JWT_SECRET_KEY, ...). Variables
#     supplied via `--env-file` are NOT passed into containers on their own.
#
# `.env.production` is written by hand on the VM (TECH.md Task 6 — operator
# only, never generated by an agent) and is gitignored. No secret and no IP
# address is hardcoded in this file.
#
# THE APP VM'S .env.production MUST CONTAIN:
#
#   DATA_VM_PRIVATE_IP=10.0.0.x            # the DATA VM's private IP, not this one's
#   DATABASE_URL=postgresql+psycopg://postgres:<POSTGRES_PASSWORD>@${DATA_VM_PRIVATE_IP}:5432/career_platform
#   KAFKA_BOOTSTRAP_SERVERS=${DATA_VM_PRIVATE_IP}:9092
#   LLM_PROVIDER=groq
#   GROQ_API_KEY=<secret>
#   GROQ_MODEL=openai/gpt-oss-120b         # optional, has a default
#   JWT_SECRET_KEY=<generated 32+ char random string>
#   CORS_ALLOWED_ORIGINS=https://<your-app>.vercel.app
#   API_DOMAIN=api.<your-domain>           # read by the Caddyfile
#   CADDY_EMAIL=<your-email>               # ACME contact address
#   PYTHONUNBUFFERED=1                     # already set in the image; harmless
#
# CRITICAL, and the single most likely thing to get wrong here: DATABASE_URL
# and KAFKA_BOOTSTRAP_SERVERS must point at the DATA VM's PRIVATE IP. The
# service names `postgres:5432` / `kafka:9092` from the old single-VM stack
# resolve to NOTHING on this VM — there is no shared Docker network across two
# machines — and `localhost` is this VM. The password inside DATABASE_URL must
# match POSTGRES_PASSWORD in the Data VM's own .env.production exactly.
#
# `${DATA_VM_PRIVATE_IP}` inside DATABASE_URL above is expanded by Compose when
# it builds the container environment — variables defined earlier in the same
# env file are available to later lines. Verified against this repo's Compose
# (v2.24+ / v5.x); on an older Compose the placeholder would be passed through
# literally, so if you would rather not depend on the version, just write the
# IP out twice.
# ---------------------------------------------------------------------------

services:
  api:
    build: .
    command: python scripts/run_server.py
    restart: unless-stopped
    # `expose`, not `ports`: 8000 is reachable from other containers on this
    # VM's compose network (Caddy proxies to `api:8000`) but is never published
    # to the host or the internet. HTTPS termination is Caddy's job. This hop
    # is unaffected by the two-VM split — Caddy and the API are still
    # containers side by side on the same machine, so the Caddyfile needs no
    # change at all.
    expose:
      - "8000"
    env_file:
      # DATABASE_URL, KAFKA_BOOTSTRAP_SERVERS, LLM_PROVIDER, GROQ_API_KEY,
      # JWT_SECRET_KEY, CORS_ALLOWED_ORIGINS, ... — see .env.example for the
      # full set of names the app actually reads.
      - .env.production
    # NO `depends_on: postgres` / `kafka`.
    #
    # This is the one real guarantee the two-VM split costs us. In the
    # single-VM stack these services waited for `postgres: condition:
    # service_healthy` before starting, so the API could not come up against a
    # database that was not yet accepting connections. Docker Compose has no
    # cross-HOST dependency or health condition — it can only order containers
    # it manages itself, and Postgres/Kafka are managed by a different compose
    # project on a different machine.
    #
    # What replaces it:
    #   1. Deploy order (TECH.md Task 8): bring the Data VM up FIRST and
    #      confirm it is reachable before touching this VM.
    #   2. `restart: unless-stopped` plus the app's own connection retry logic:
    #      SQLAlchemy re-establishes connections per request, and the Kafka
    #      client retries its bootstrap, so a transiently unreachable Data VM
    #      degrades to failing requests and recovers on its own rather than
    #      needing a manual restart here.
    #   3. The healthcheck below, which turns "the Data VM is unreachable" into
    #      a visible `unhealthy` in `docker compose ps` instead of silence.
    healthcheck:
      # GET /health returns 200 only when BOTH Postgres and Kafka answer, and
      # 503 (naming which one is down in the body) otherwise — see
      # src/infrastructure/health/api.py. Across two VMs that makes it the
      # closest thing we have to the dependency check lost above: it reports
      # reachability from the client side, which is the side that matters.
      #
      # urllib rather than curl/wget: the image is python:3.11-slim and ships
      # neither. `interval: 30s` (not the 5s used for Postgres on the Data VM)
      # keeps the cost of spawning a Python interpreter per probe negligible on
      # a 1 GB box, and `start_period` covers the slow first import.
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  consumers:
    # Same image as `api` (same build context / Dockerfile), different
    # entrypoint command. Background worker — no ports published or exposed,
    # and no healthcheck: it serves no endpoint to probe. Watch it with
    # `docker compose logs -f consumers`.
    build: .
    command: python scripts/run_consumers.py
    restart: unless-stopped
    env_file:
      - .env.production
    # Same cross-VM caveat as `api` above: no depends_on is possible, and the
    # Kafka client's own bootstrap retries are what carry it through a Data VM
    # that is slow to come up.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"    # ACME HTTP-01 challenge + HTTP->HTTPS redirect
      - "443:443"  # public HTTPS entrypoint
    volumes:
      # Caddyfile authored in TECH.md Task 4; read-only inside the container.
      # Unchanged by the two-VM split — it only ever references `api:8000`,
      # which is still a container on this same VM.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volumes so issued Let's Encrypt certificates and Caddy's state
      # survive container recreation. Without caddy_data especially, every
      # restart would re-request certs and quickly hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # The Caddyfile uses `{$VAR}` placeholders for the domain and the ACME
      # contact address instead of hardcoding them. Interpolated from
      # .env.production via --env-file. Deliberately NOT `env_file:` — Caddy has
      # no business holding GROQ_API_KEY or JWT_SECRET_KEY.
      CADDY_EMAIL: ${CADDY_EMAIL:-}
      API_DOMAIN: ${API_DOMAIN:-}
    depends_on:
      # `service_started`, NOT `service_healthy`, even though `api` now has a
      # healthcheck. If the Data VM is down, `api` never reports healthy — and
      # a Caddy that refuses to start in that case would take the site fully
      # dark (no TLS, no cert renewal, no error page) instead of returning a
      # 502 the operator can actually diagnose.
      - api

volumes:
  caddy_data:
  caddy_config:

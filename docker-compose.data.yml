# DATA VM stack for the beta deployment (docs/deployment/TECH.md, Tasks 1/3/8).
#
# Runs on the Oracle Cloud "Data VM" only: PostgreSQL + Kafka, nothing else.
# Its sibling file docker-compose.app.yml runs the API, the Kafka consumer
# workers and Caddy on the separate "App VM".
#
# WHY TWO VMs AT ALL: Oracle's Always Free tier could not allocate the 24 GB
# ARM shape (VM.Standard.A1.Flex) in this account's region — persistent
# out-of-capacity errors. The fallback is two VM.Standard.E2.1.Micro AMD
# instances at 1 GB RAM each, which is the tier ceiling (exactly two are
# allowed). Splitting stateful services onto one box and stateless services
# onto the other is what makes 1 GB per box workable; see the RAM risk note in
# docs/deployment/PRODUCT.md.
#
# This is a STANDALONE file, NOT an overlay. Do not combine it with
# docker-compose.yml: that file is local-dev-only and carries two settings that
# are actively wrong here (host port 5433, and a `localhost` advertised Kafka
# listener). What is needed from it has been copied and adapted below.
#
# ---------------------------------------------------------------------------
# USAGE (the single supported command — run it from the repo root on the DATA VM):
#
#   docker compose --env-file .env.production -f docker-compose.data.yml up -d
#
# `--env-file .env.production` feeds ${VAR} INTERPOLATION in this YAML. Compose
# only auto-reads a file literally named `.env`, so without the flag both
# required variables below resolve to nothing and compose aborts with the
# messages spelled out in their `:?` defaults. No `env_file:` is needed on
# these services — neither Postgres nor Kafka reads the app's variables.
#
# `.env.production` is written by hand on the VM (TECH.md Task 6 — operator
# only, never generated by an agent) and is gitignored. Nothing secret-shaped
# and no IP address is hardcoded in this file.
#
# THE DATA VM'S .env.production NEEDS EXACTLY TWO VARIABLES:
#
#   POSTGRES_PASSWORD=<generated, e.g. `openssl rand -hex 16`>
#   DATA_VM_PRIVATE_IP=10.0.0.x          # this VM's own private IP
#
# The App VM's .env.production must repeat the SAME password inside its
# DATABASE_URL and the SAME IP in DATABASE_URL / KAFKA_BOOTSTRAP_SERVERS.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: career_platform
      # `:?` (not `:-postgres`) is deliberate: silently falling back to the
      # local-dev password on a box whose database port is open to another
      # machine is exactly the failure this guard exists to prevent. Compose
      # aborts with the message below if the variable is missing, which also
      # catches a forgotten `--env-file .env.production`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — run compose with --env-file .env.production (see TECH.md Task 6)}
    ports:
      # Published to the VM host, NOT merely `expose`d. The client (the `api`
      # and `consumers` containers) lives on a different machine, so there is
      # no shared Docker network to reach it over — the connection arrives as
      # ordinary TCP on this VM's private IP and must be bound on the host.
      #
      # 5432:5432, not the local-dev file's 5433:5432. That mapping only exists
      # to dodge a pre-existing native Postgres on the developer's Windows
      # machine; a fresh cloud VM has no such conflict, and the standard port
      # keeps DATABASE_URL on the App VM unsurprising.
      #
      # SECURITY: this binds 0.0.0.0:5432, i.e. the public interface too. What
      # keeps it private is the Oracle Security List (TECH.md Task 1: allow
      # 10.0.0.0/24 only, on 5432 and 9092) plus the VM's own iptables. If you
      # want defence in depth that does not depend on the cloud firewall alone,
      # bind to the private IP explicitly instead: "${DATA_VM_PRIVATE_IP}:5432:5432".
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Still worth keeping even though the App VM can no longer depend on it
      # (see docker-compose.app.yml): it makes `docker compose ps` on this VM
      # answer "is the database actually accepting connections" during a deploy.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      # Same reasoning as Postgres above: the consumers are on another host.
      - "9092:9092"
    environment:
      # KRaft mode (no separate Zookeeper container needed).
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      # ===================================================================
      # THE PRODUCTION-CRITICAL SETTING. READ BEFORE CHANGING.
      # ===================================================================
      # A Kafka client does NOT keep talking to the address it bootstrapped
      # against. The bootstrap connection only fetches cluster metadata; the
      # broker replies with its ADVERTISED listener address, and the client
      # then opens its real produce/consume connections to THAT address. So an
      # advertised address that the client cannot resolve or route to produces
      # a very specific, confusing failure: bootstrap appears to succeed, then
      # every send and poll fails with connection refused / endless retries.
      #
      # This exact bug already bit this project once, in the single-VM version
      # of this stack: docker-compose.yml advertises `localhost:9092` (correct
      # when the only client is the developer's own machine), which made the
      # API container resolve `localhost` to ITSELF rather than the broker.
      # The single-VM fix was to advertise the compose service name `kafka`.
      #
      # That fix is now WRONG TOO, in a new form: the clients are on a separate
      # VM. There is no shared Docker network across two VMs and no embedded
      # DNS there, so the name `kafka` resolves to nothing on the App VM.
      # The only address that works for every client is this VM's PRIVATE IP,
      # supplied per-deployment from .env.production and never hardcoded here.
      #
      # Sanity check after `up -d`, run FROM THE APP VM:
      #   nc -zv <DATA_VM_PRIVATE_IP> 9092
      #   docker compose exec api python -c "import os;from confluent_kafka.admin import AdminClient;print(AdminClient({'bootstrap.servers':os.environ['KAFKA_BOOTSTRAP_SERVERS']}).list_topics(timeout=10).brokers)"
      # The printed broker host must be the private IP, not `localhost`/`kafka`.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${DATA_VM_PRIVATE_IP:?DATA_VM_PRIVATE_IP must be set to this VM's private IP (e.g. 10.0.0.5) — run compose with --env-file .env.production (see TECH.md Task 1)}:9092

      # Quorum voter stays a container-local address: with a single combined
      # controller+broker node this connection never leaves the container, so
      # it must NOT be the private IP (which is not bound inside the container).
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

      # JVM heap cap. Without this, /opt/kafka/bin/kafka-server-start.sh in the
      # apache/kafka:3.7.0 image defaults to `-Xmx1G -Xms1G` — a whole 1 GB of
      # heap on a VM that has exactly 1 GB of RAM in total and must also run
      # Postgres. The broker would be OOM-killed under any real load.
      #
      # 384 MB is ample for this workload (a handful of low-volume topics, one
      # broker, one consumer group) and leaves room for Postgres plus the JVM's
      # own off-heap and page-cache usage on top of the heap number.
      #
      # KAFKA_HEAP_OPTS is the variable this image actually reads: verified
      # against the image itself, not assumed — kafka-server-start.sh only
      # applies its 1G default `if [ "x$KAFKA_HEAP_OPTS" = "x" ]`, and a test
      # run of this image with the value below shows `-Xmx384m -Xms384m` on the
      # live JVM command line and logs "Kafka Server started". (The image's
      # env->properties wrapper also copies it into server.properties as an
      # unknown `heap.opts` key, which the broker ignores harmlessly.)
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    # No healthcheck: every available broker probe (kafka-broker-api-versions.sh
    # and friends) starts a fresh JVM per check, which is a real cost repeated
    # every few seconds on a 1 GB box. `docker compose logs kafka` and the
    # /health endpoint on the App VM's API — which reports Kafka reachability
    # from the place that actually matters, the client side — cover this
    # instead.

volumes:
  postgres-data:
  kafka-data:
